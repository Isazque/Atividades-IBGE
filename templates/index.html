<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IBGEF - Municípios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #264480;
      --azul-escuro: #1a3060;
      --azul-claro: #3a62b3;
      --verde: #1c8f3c;
      --fundo: #eef2f9;
      --borda: #dde3ee;
      --texto: #1f2937;
      --sombra: 0 2px 6px rgba(20, 40, 90, .08), 0 8px 24px rgba(20, 40, 90, .06);
      --sombra-hover: 0 4px 10px rgba(20, 40, 90, .12), 0 12px 28px rgba(20, 40, 90, .10);
    }
 
    * { transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, color .15s ease; }
 
    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background: linear-gradient(180deg, var(--fundo) 0%, #f8faff 100%) fixed;
      color: var(--texto);
      min-height: 100vh;
    }
 
    
    .hero {
      background: linear-gradient(135deg, var(--azul-escuro) 0%, var(--azul) 55%, var(--azul-claro) 100%);
      color: #fff;
      text-align: center;
      padding: 3.5rem 1rem 5rem;
      position: relative;
      overflow: hidden;
    }
    .hero::before, .hero::after {
      content: ""; position: absolute; border-radius: 50%;
      background: rgba(255, 255, 255, .06); pointer-events: none;
    }
    .hero::before { width: 320px; height: 320px; top: -140px; left: -80px; }
    .hero::after  { width: 240px; height: 240px; bottom: -120px; right: -60px; }
    .hero h1 { font-weight: 700; font-size: 2.2rem; margin-bottom: .5rem; letter-spacing: -.01em; position: relative; }
    .hero p { margin: 0; opacity: .9; font-size: 1.1rem; position: relative; }
 
    
    .stats { margin-top: -2.8rem; position: relative; z-index: 2; }
    .stat {
      background: #fff;
      border-radius: .75rem;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: var(--sombra);
      border: 1px solid var(--borda);
      border-left: 4px solid var(--azul);
      height: 100%;
    }
    .stat:hover { transform: translateY(-2px); box-shadow: var(--sombra-hover); }
    .stat i {
      font-size: 1.3rem; color: var(--azul); width: 2.8rem; height: 2.8rem;
      display: flex; align-items: center; justify-content: center;
      background: #e8eefb; border-radius: 50%; flex-shrink: 0;
    }
    .stat span { display: block; color: #6b7280; line-height: 1.3; font-size: .85rem; }
    .stat span + span { color: var(--texto); font-weight: 700; font-size: 1.1rem; }
 
    
    .painel {
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: .75rem;
      overflow: hidden;
      box-shadow: var(--sombra);
    }
    .painel-titulo {
      background: linear-gradient(180deg, #f8f9fc, #eff2f8);
      padding: .9rem 1.2rem;
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--azul-escuro);
      border-bottom: 1px solid var(--borda);
      border-left: 4px solid var(--azul);
      margin: 0;
    }
    .painel-corpo { padding: 1.25rem; }
 
   
    .form-label { color: #4b5563; font-weight: 500; }
    .form-control, .form-control-sm {
      border-radius: .5rem;
      border: 1px solid #cdd5e3;
      background: #fcfdff;
    }
    .form-control:focus {
      border-color: var(--azul-claro);
      box-shadow: 0 0 0 .2rem rgba(58, 98, 179, .18);
      background: #fff;
    }
    .form-check-input:checked { background-color: var(--azul); border-color: var(--azul); }
    .form-check-input:focus { box-shadow: 0 0 0 .2rem rgba(58, 98, 179, .18); border-color: var(--azul-claro); }
 
   
    .btn { border-radius: .5rem; font-weight: 500; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0, 0, 0, .15); }
    .btn:active { transform: translateY(0); box-shadow: none; }
    .btn-success { background: var(--verde); border-color: var(--verde); }
    .btn-success:hover { background: #167a32; border-color: #167a32; }
    .btn-primary { background: var(--azul); border-color: var(--azul); }
    .btn-primary:hover { background: var(--azul-escuro); border-color: var(--azul-escuro); }
    .btn-outline-primary { color: var(--azul); border-color: var(--azul); }
    .btn-outline-primary:hover { background: var(--azul); border-color: var(--azul); }
 
    
    .table { margin-bottom: 0; }
    .table th {
      font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em;
      color: var(--azul-escuro); background: #f3f6fc; border-bottom: 2px solid var(--borda);
      white-space: nowrap;
    }
    .table td { border-color: #edf0f6; }
    .table tbody tr:hover { background: #f1f5fd; }
    .table tbody tr:nth-child(even) { background: #fafbfe; }
    .table tbody tr:nth-child(even):hover { background: #f1f5fd; }
    .table-responsive { max-height: 520px; overflow-y: auto; border: 1px solid var(--borda); border-radius: .5rem; }
    .table-responsive thead th { position: sticky; top: 0; z-index: 1; }
    .table .btn-sm { padding: .25rem .55rem; }
 
    
    .alert { border-radius: .5rem; border: none; border-left: 4px solid currentColor; font-weight: 500; }
 
   
    footer { text-align: center; font-size: .9rem; color: #4b5563; padding: 1.5rem 0 2.5rem; }
    footer a { color: var(--azul); font-weight: 500; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
 
   
    @media (max-width: 575.98px) {
      .hero { padding: 2.5rem 1rem 4.5rem; }
      .hero h1 { font-size: 1.6rem; }
      .hero p { font-size: 1rem; }
      .painel-titulo { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
 
  <header class="hero">
    <h1>Atividade Prática 01: Municípios do Nordeste</h1>
    <p>Gerenciamento de Municípios (Base em Memória)</p>
  </header>
 
  <div class="container stats">
    <div class="row g-3">
      <div class="col-6 col-lg-3">
        <div class="stat"><i class="fa-solid fa-map-location-dot"></i>
          <div><span>Região:</span><span id="meta-regiao">-</span></div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat"><i class="fa-solid fa-flag" style="color:#1c8f3c"></i>
          <div><span>País:</span><span id="meta-pais">-</span></div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat"><i class="fa-solid fa-users"></i>
          <div><span>Total:</span><span id="meta-total">-</span></div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="stat"><i class="fa-solid fa-circle-info"></i>
          <div><span>Fonte:</span><span id="meta-fonte">-</span></div></div>
      </div>
    </div>
  </div>
 
  <main class="container my-4">
    <div class="row g-4">
 
      
      <div class="col-lg-5">
        <div class="painel">
          <h2 class="painel-titulo">Cadastrar / Atualizar Município</h2>
          <div class="painel-corpo">
            <form id="form" autocomplete="off">
              <div class="mb-2">
                <label class="form-label small mb-1" for="nome">Nome do Município</label>
                <input class="form-control form-control-sm" id="nome" required>
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1" for="id_ibge">ID IBGE</label>
                <input class="form-control form-control-sm" id="id_ibge" type="number" min="1" required>
              </div>
              <div class="row g-2 mb-2">
                <div class="col-8">
                  <label class="form-label small mb-1" for="estado">Estado</label>
                  <input class="form-control form-control-sm" id="estado" required>
                </div>
                <div class="col-4">
                  <label class="form-label small mb-1" for="sigla_uf">UF</label>
                  <input class="form-control form-control-sm text-uppercase" id="sigla_uf"
                         maxlength="2" pattern="[A-Za-z]{2}" required>
                </div>
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1" for="populacao">População Estimada</label>
                <input class="form-control form-control-sm" id="populacao" type="number" min="0" required>
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="capital">
                <label class="form-check-label" for="capital">Capital?</label>
              </div>
              <button type="submit" class="btn btn-success btn-sm">Salvar / Atualizar</button>
              <button type="button" id="btn-buscar" class="btn btn-primary btn-sm">Buscar por Nome</button>
              <button type="button" id="btn-parcial" class="btn btn-warning btn-sm">Atualizar Parcial</button>
            </form>
            <div id="mensagem" class="mt-3"></div>
          </div>
        </div>
      </div>
 
      
      <div class="col-lg-7">
        <div class="painel">
          <h2 class="painel-titulo">Lista de Municípios</h2>
          <div class="painel-corpo">
            <div class="row g-3 mb-3">
              <div class="col-sm-7">
                <label class="form-label small mb-1" for="busca">Busca</label>
                <input class="form-control form-control-sm" id="busca" placeholder="Busca">
              </div>
              <div class="col-sm-5">
                <label class="form-label small mb-1" for="filtro-uf">Filtrar por UF</label>
                <input class="form-control form-control-sm text-uppercase" id="filtro-uf"
                       maxlength="2" placeholder="ex: CE">
              </div>
            </div>
 
            <div class="d-flex justify-content-end gap-2 mb-3">
              <a class="btn btn-outline-primary btn-sm" href="/download/municipios.json" download>
                <i class="fa-solid fa-download"></i> Baixar JSON
              </a>
              <button type="button" id="btn-novo" class="btn btn-success btn-sm">Cadastrar Novo</button>
            </div>
 
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Nome</th><th>UF</th><th>Capital</th>
                    <th>População</th><th>ID IBGE</th><th>Ações</th>
                  </tr>
                </thead>
                <tbody id="tabela"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
 
    </div>
  </main>
 
  <footer>
    Desenvolvido em <a href="https://flask.palletsprojects.com/" target="_blank" rel="noopener">Flask</a>
    | Manipulação de Dicionários
  </footer>
 
  <script>
    const API = "/municipios";
    const $ = id => document.getElementById(id);
    let municipios = {};
 
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
 
    function mostrarMsg(texto, tipo = "success") {
      $("mensagem").innerHTML = `<div class="alert alert-${tipo} py-2 mb-0">${esc(texto)}</div>`;
    }
 
    async function req(url, opcoes = {}) {
      const resp = await fetch(url, opcoes);
      let dados = null;
      try { dados = await resp.json(); } catch (e) { /* sem corpo JSON */ }
      return { ok: resp.ok, status: resp.status, dados };
    }
 
    const jsonOpts = (metodo, corpo) => ({
      method: metodo,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo),
    });
 
    const urlNome = nome => `${API}/${encodeURIComponent(nome)}`;
 
    async function carregarMetadados() {
      const r = await req("/metadados");
      if (!r.ok) return;
      $("meta-regiao").textContent = r.dados.regiao;
      $("meta-pais").textContent = r.dados.pais;
      $("meta-total").textContent = r.dados.total_municipios;
      $("meta-fonte").textContent = r.dados.fonte_dados_populacao;
    }
 
    async function carregarMunicipios() {
      const uf = $("filtro-uf").value.trim();
      const r = await req(uf ? `${API}?uf=${encodeURIComponent(uf)}` : API);
      municipios = r.ok ? r.dados : {};
      renderTabela();
    }
 
    const recarregar = () => Promise.all([carregarMunicipios(), carregarMetadados()]);
 
    function renderTabela() {
      const termo = norm($("busca").value.trim());
      const linhas = Object.entries(municipios)
        .filter(([nome]) => norm(nome).includes(termo))
        .map(([nome, m]) => `
          <tr>
            <td>${esc(nome)}</td>
            <td>${esc(m.sigla_uf)}</td>
            <td>${m.capital ? "Sim" : "Não"}</td>
            <td>${Number(m.populacao_estimada).toLocaleString("pt-BR")}</td>
            <td>${esc(m.id_ibge)}</td>
            <td class="text-nowrap">
              <button class="btn btn-primary btn-sm" data-acao="editar" data-nome="${esc(nome)}" title="Editar">
                <i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-danger btn-sm" data-acao="excluir" data-nome="${esc(nome)}" title="Excluir">
                <i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`);
      $("tabela").innerHTML = linhas.length
        ? linhas.join("")
        : `<tr><td colspan="6" class="text-center text-muted py-3">Nenhum município encontrado.</td></tr>`;
    }
 
    function limparForm() {
      $("form").reset();
      $("mensagem").innerHTML = "";
    }
 
    function preencherForm(nome, m) {
      $("nome").value = nome;
      $("id_ibge").value = m.id_ibge;
      $("estado").value = m.estado;
      $("sigla_uf").value = m.sigla_uf;
      $("populacao").value = m.populacao_estimada;
      $("capital").checked = !!m.capital;
    }
 
   
    $("form").addEventListener("submit", async e => {
      e.preventDefault();
      const nome = $("nome").value.trim();
      const dados = {
        id_ibge: parseInt($("id_ibge").value, 10),
        estado: $("estado").value.trim(),
        sigla_uf: $("sigla_uf").value.trim().toUpperCase(),
        capital: $("capital").checked,
        populacao_estimada: parseInt($("populacao").value, 10),
      };
      const existe = (await req(urlNome(nome))).ok;
      const r = existe
        ? await req(urlNome(nome), jsonOpts("PUT", dados))
        : await req(API, jsonOpts("POST", { nome, ...dados }));
      if (r.ok) {
        mostrarMsg(existe ? `Município "${nome}" atualizado.` : `Município "${nome}" cadastrado.`);
        await recarregar();
      } else {
        mostrarMsg((r.dados && r.dados.erro) || "Erro ao salvar.", "danger");
      }
    });
 
    $("btn-buscar").addEventListener("click", async () => {
      const nome = $("nome").value.trim();
      if (!nome) return mostrarMsg("Digite o nome do município para buscar.", "warning");
      const r = await req(urlNome(nome));
      if (!r.ok) return mostrarMsg((r.dados && r.dados.erro) || "Município não encontrado.", "danger");
      preencherForm(nome, r.dados[nome]);
      mostrarMsg(`Município "${nome}" encontrado.`, "info");
    });
 
    // Atualizar Parcial: PATCH enviando apenas os campos preenchidos
    $("btn-parcial").addEventListener("click", async () => {
      const nome = $("nome").value.trim();
      if (!nome) return mostrarMsg("Digite o nome do município a atualizar.", "warning");
      const dados = {};
      if ($("id_ibge").value !== "") dados.id_ibge = parseInt($("id_ibge").value, 10);
      if ($("estado").value.trim()) dados.estado = $("estado").value.trim();
      if ($("sigla_uf").value.trim()) dados.sigla_uf = $("sigla_uf").value.trim().toUpperCase();
      if ($("populacao").value !== "") dados.populacao_estimada = parseInt($("populacao").value, 10);
      if ($("capital").checked) dados.capital = true;
      if (!Object.keys(dados).length) return mostrarMsg("Preencha ao menos um campo para atualizar.", "warning");
      const r = await req(urlNome(nome), jsonOpts("PATCH", dados));
      if (r.ok) { mostrarMsg(`Município "${nome}" atualizado parcialmente.`); await recarregar(); }
      else mostrarMsg((r.dados && r.dados.erro) || "Erro ao atualizar.", "danger");
    });
 
    $("btn-novo").addEventListener("click", () => { limparForm(); $("nome").focus(); });
 
    $("tabela").addEventListener("click", async e => {
      const botao = e.target.closest("button[data-acao]");
      if (!botao) return;
      const nome = botao.dataset.nome;
      if (botao.dataset.acao === "editar") {
        preencherForm(nome, municipios[nome]);
        $("mensagem").innerHTML = "";
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else if (confirm(`Excluir o município "${nome}"?`)) {
        const r = await req(urlNome(nome), { method: "DELETE" });
        if (r.ok) { mostrarMsg(`Município "${nome}" removido.`); await recarregar(); }
        else mostrarMsg((r.dados && r.dados.erro) || "Erro ao excluir.", "danger");
      }
    });
 
    $("busca").addEventListener("input", renderTabela);
    $("filtro-uf").addEventListener("input", carregarMunicipios);
 
    recarregar();
  </script>
</body>
</html>
